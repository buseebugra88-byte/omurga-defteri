// ---------- storage
const queues = {};
function save(id, body){
  if(!S.db) return Promise.resolve();
  const ref = S.db.collection(S.base).doc(id);
  queues[id] = (queues[id]||Promise.resolve()).then(() => body===null ? ref.delete() : ref.set(body))
    .catch(e => { if(e && e.code==="invalid_argument"){ S.readonly=true; render(); toast("Kaydedilemedi: bu bağlantı yalnızca görüntüleme izni veriyor."); return; }
      toast(e && e.code==="quota_exceeded" ? "Depolama dolu: eski kayıtları silin." : "Kaydedilemedi, tekrar deneyin."); });
  return queues[id];
}
function upsertPatient(p){ const i=S.patients.findIndex(x=>x.id===p.id); if(i<0) S.patients.push(p); else S.patients[i]=p; save(p.id, p); }
function upsertPub(x){ const i=S.pubs.findIndex(y=>y.id===x.id); if(i<0) S.pubs.push(x); else S.pubs[i]=x; save(x.id, x); }
function upsertStudent(s){ const i=S.students.findIndex(x=>x.id===s.id); if(i<0) S.students.push(s); else S.students[i]=s; save(s.id, s); }
function saveMeta(){ save("meta", {kind:"meta", studies:S.studies, customEx:S.customEx, exMedia:S.exMedia, hiddenEx:S.hiddenEx||[]}); }

async function init(){
  render();
  let db=null, user=null;
  try { if(window.__LOCAL){ [db,user] = await Promise.all([__LOCAL.use("db"), __LOCAL.use("user")]); } } catch(e){}
  const uid = user ? await user.id().catch(()=>null) : null;
  if(!db || !uid){ S.persist="off"; S.loaded=true; render(); return; }
  S.db=db; S.base="data/users/"+uid; S.persist="on";
  try{ const cw = user.can ? await user.can("data.write") : null; if(cw===false) S.readonly=true; }catch(e){}
  db.collection(S.base).onSnapshot(snap => {
    const pats=[], stus=[], pubs=[]; let meta=null;
    snap.docs.forEach(d => { const b=d.data(); if(!b) return; const c=()=>JSON.parse(JSON.stringify(b));
      if(b.kind==="meta") meta=b; else if(b.kind==="patient") pats.push(c()); else if(b.kind==="student") stus.push(c()); else if(b.kind==="pub") pubs.push(c()); });
    pats.sort((a,b)=>a.code.localeCompare(b.code,"tr")); stus.sort((a,b)=>a.name.localeCompare(b.name,"tr"));
    S.patients=pats; S.students=stus; S.pubs=pubs; S.studies=meta?.studies ? JSON.parse(JSON.stringify(meta.studies)) : S.studies; S.customEx=meta?.customEx ? JSON.parse(JSON.stringify(meta.customEx)) : S.customEx; S.exMedia=meta?.exMedia ? JSON.parse(JSON.stringify(meta.exMedia)) : S.exMedia; S.hiddenEx=meta?.hiddenEx ? [...meta.hiddenEx] : (S.hiddenEx||[]);
    S.loaded=true; render();
  }, () => { S.persist="off"; S.loaded=true; render(); });
}

async function doBackup(){
  if(!window.__LOCAL) return;
  const body=JSON.stringify({app:"omurga-defteri", version:1, created:new Date().toISOString(), docs:window.__LOCAL.dump()}, null, 1);
  const dl=await window.__LOCAL.use("downloads"); await dl.save({filename:`omurga-defteri-yedek-${today()}.json`, data:body});
  window.__LOCAL.markBackup(); render(); toast("Yedek indirildi; dosyayı güvenli bir yerde saklayın.");
}
function readRestore(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); if(j.app!=="omurga-defteri"||!j.docs||typeof j.docs!=="object") throw 0;
      const v=Object.values(j.docs); S.restoreData={docs:j.docs, np:v.filter(x=>x&&x.kind==="patient").length, ns:v.filter(x=>x&&x.kind==="student").length}; renderSheet();
    }catch(e){ toast("Bu dosya defterin yedek dosyası değil."); } };
  r.readAsText(file);
}

function icfPanel(p){
  const prof=[...(p.icf||[])].sort((a,b)=>a.date.localeCompare(b.date));
  if(!prof.length) return `<div class="panel"><div class="panel-h"><h3>ICF profili</h3><button class="btn" data-act="newIcf" data-id="${p.id}">+ ICF değerlendirmesi</button></div>
    <p class="hint">Bel veya boyun çekirdek setinden seçilmiş kategorilerle hastanın fonksiyonel profilini çıkarın; tekrarlandığında değişim yan yana görünür.</p></div>`;
  const first=prof[0], last=prof[prof.length-1];
  const codes=[...new Set([first,last].flatMap(pr=>[...Object.keys(pr.r||{}), ...(pr.extra||[]).map(x=>x.c)]))];
  const val=(pr,c)=>{ const r=pr.r?.[c]; if(r!=null&&r!=="") return r; return (pr.extra||[]).find(x=>x.c===c)?.q ?? ""; };
  const name=(c)=>icfName(c)||([...(last.extra||[]),...(first.extra||[])].find(x=>x.c===c)?.t)||"";
  const groups=["b","s","d","e"].map(k=>({k, rows:codes.filter(c=>c[0]===k).sort()})).filter(g=>g.rows.length);
  const cell=(q,k)=>{ if(q===""||q==null) return `<span class="hint">—</span>`; if(q==="8"||q==="9") return `<span class="hint mono">${q}</span>`;
    const n = k==="e" ? (String(q).startsWith("+")?-(+q.slice(1)):+q) : +q;
    const cls = n<0?"fac":n===0?"q0":n<=1?"q1":n<=2?"q2":"q3";
    const w = Math.abs(n)*25;
    return `<span class="qbar"><span class="qf ${cls}" style="width:${Math.max(w,4)}%"></span></span><span class="mono qv">${esc(q)}</span>`; };
  const rows=groups.map(g=>`<tr class="comp"><td colspan="${prof.length>1?4:2}">${ICF_COMP[g.k]}</td></tr>`+g.rows.map(c=>{
      const a=val(first,c), b=val(last,c);
      const ch = prof.length>1 && a!==""&&b!==""&&!["8","9"].includes(a)&&!["8","9"].includes(b) ? (()=>{ const na=g.k==="e"?(String(a).startsWith("+")?-(+a.slice(1)):+a):+a, nb=g.k==="e"?(String(b).startsWith("+")?-(+b.slice(1)):+b):+b; const d=nb-na; if(g.k==="e"){ const f=-d; return f>0?`<span class="delta good">+${f} kolaylaştırıcı</span>`:f<0?`<span class="delta bad">${f}</span>`:`<span class="delta flat">0</span>`; } return d<0?`<span class="delta good">${d}</span>`:d>0?`<span class="delta bad">+${d}</span>`:`<span class="delta flat">0</span>`; })() : "";
      return `<tr><td><span class="mono">${esc(c)}</span> <span class="icfn">${esc(name(c))}</span></td>${prof.length>1?`<td class="qc">${cell(a,g.k)}</td>`:""}<td class="qc">${cell(b,g.k)}</td>${prof.length>1?`<td class="num">${ch}</td>`:""}</tr>`; }).join("")).join("");
  return `<div class="panel"><div class="panel-h"><h3>ICF profili</h3><div class="actions">
      <button class="btn" data-act="editIcf" data-id="${p.id}" data-a="${last.id}">Son profili düzenle</button><button class="btn primary" data-act="newIcf" data-id="${p.id}">+ ICF değerlendirmesi</button></div></div>
    <div class="tbl-wrap"><table class="icf"><thead><tr><th>Kategori</th>${prof.length>1?`<th>${shortDate(first.date)}</th>`:""}<th>${shortDate(last.date)}</th>${prof.length>1?`<th class="num">Değişim</th>`:""}</tr></thead><tbody>${rows}</tbody></table></div>
    ${last.pf?`<p class="icfpf"><span class="label">Kişisel faktörler</span> ${esc(last.pf)}</p>`:""}
    ${last.goal?`<p class="icfpf"><span class="label">Hedef</span> ${esc(last.goal)}</p>`:""}
    <p class="hint">Niteleyici 0 sorun yok – 4 tam sorun. Çevresel faktörlerde + kolaylaştırıcı, düz sayı engeldir. ${prof.length} ICF değerlendirmesi; ilk ve son karşılaştırılıyor.</p></div>`;
}

      <span class="bv mono">${v}</span><span class="bt"><span class="bf ${v>=80?"hi":v>=50?"mid":"lo"}" style="height:${Math.max(v,3)}%"></span></span><span class="bl mono">${esc(shortDate(a.week))}</span></div>`; }).join("");

    ${items.length?`<div class="adh">
      <div class="adh-h"><div><div class="label">Haftalık uyum</div>${avg!=null?`<div class="adh-avg"><span class="mono">%${avg}</span> <span class="hint">ortalama, ${adh.length} hafta</span></div>`:`<div class="hint">Her hafta sonunda yapılan seans sayısını girin.</div>`}</div>

function chart(as, m, g){
  const pts = as.map(a=>({d:a.date, v:m.get(a)})).filter(x=>x.v!=null);
  if(!pts.length) return `<div class="hint">${m.label} için veri girilmemiş.</div>`;
  const W=640,H=230,L=44,R=20,T=22,B=34;
  let lo = m.min ?? Math.min(...pts.map(x=>x.v)), hi = m.max ?? Math.max(...pts.map(x=>x.v));
  if(m.min==null||m.max==null){ const pad=(hi-lo||Math.abs(hi)||1)*0.25; if(m.min==null) lo=Math.max(0,lo-pad); if(m.max==null) hi=hi+pad; }
  if(hi===lo) hi=lo+1;
  const x = i => pts.length===1 ? (L+W-R)/2 : L + i*(W-L-R)/(pts.length-1);
  const y = v => T + (hi-v)*(H-T-B)/(hi-lo);
  const ticks=[0,1,2,3,4].map(i=>lo+(hi-lo)*i/4);
  const dg = (hi-lo)<5 ? 1 : 0;
  const line = pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area = pts.length>1 ? `${line} L${x(pts.length-1).toFixed(1)},${H-B} L${x(0).toFixed(1)},${H-B} Z` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label)} zaman içinde">
    ${ticks.map(t=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L-8}" y="${y(t)+4}" text-anchor="end">${fmt(t,dg)}</text>`).join("")}
    ${area?`<path class="ar ${g}" d="${area}" opacity=".55"/>`:""}<path class="ln ${g}" d="${line}"/>
    ${pts.map((p,i)=>`<circle class="pt ${g} ${i===pts.length-1?"last":""}" cx="${x(i)}" cy="${y(p.v)}" r="4.5"/>
      <text class="vl" x="${x(i)}" y="${y(p.v)-10}" text-anchor="middle">${fmt(p.v,m.dg||1)}</text>
      <text class="ax" x="${x(i)}" y="${H-12}" text-anchor="middle">${esc(shortDate(p.d))}</text>`).join("")}
  </svg>`;
}

const CSV_COLS = ["hasta_kodu","hasta_turu","bolge","tani","cerrahi","cerrahi_tarihi","cinsiyet","yas","calisma","kol","ziyaret","tarih","postop_hafta","nrs","odi_ham","odi_yuzde","ndi_ham","ndi_yuzde","csa_l4l5_sag","csa_l4l5_sol","csa_l5s1_sag","csa_l5s1_sol","asimetri_l4l5_yuzde","csa_c4c5_sag","csa_c4c5_sol","csa_c5c6_sag","csa_c5c6_sol","asimetri_c5c6_yuzde","kalinlik_dinlenme_mm","kalinlik_kontraksiyon_mm","kontraksiyon_orani","goutallier","ksft_aktivasyon_mmhg","ksft_performans_indeksi","rom_fleksiyon","rom_ekstansiyon","rom_rotasyon_sag","rom_rotasyon_sol","ortalama_egzersiz_uyumu_yuzde","not"];
function adhAvg(p){ const ad=p.program?.adherence||[]; return ad.length?Math.round(mean(ad.map(a=>a.target?Math.min(100,a.done/a.target*100):0))):null; }
function buildCsv(studyId){
  const sts=ST(); const pats = P().filter(p=>studyId==="ALL"||p.study===studyId);
  const q = v => { if(v==null||v==="") return ""; const s=String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const r = (v,d) => v==null ? "" : (Math.round(v*10**d)/10**d);
  const lines=[CSV_COLS.join(",")];
  pats.forEach(p => [...p.assessments].sort((a,b)=>a.date.localeCompare(b.date)).forEach(a => {
    const st=sts.find(s=>s.id===p.study);
    lines.push([p.code,(p.type||"POSTOP")==="OZEL"?"ozel":"cerrahi_sonrasi",p.group,p.dx,p.surgery,p.surgeryDate,p.sex,p.age,st?.name,p.arm,a.visit,a.date,weeksPost(p.surgeryDate,a.date),
      num(a.nrs),num(a.odi_raw),r(M.odi.get(a),1),num(a.ndi_raw),r(M.ndi.get(a),1),num(a.l4r),num(a.l4l),num(a.l5r),num(a.l5l),r(M.asym.get(a),1),
      num(a.c4r),num(a.c4l),num(a.c5r),num(a.c5l),r(M.casym.get(a),1),num(a.rest_mm),num(a.contr_mm),r(M.ratio.get(a),3),
      a.goutallier,num(a.ccft),num(a.ccft_pi),num(a.flex),num(a.ext),num(a.rotR),num(a.rotL),adhAvg(p),a.note].map(q).join(","));
  }));
  return "﻿"+lines.join("\n");
}
async function exportIcf(studyId){
  const pats=P().filter(p=>studyId==="ALL"||p.study===studyId);
  const q=v=>{ const x=String(v??""); return /[",\n]/.test(x)?`"${x.replace(/"/g,'""')}"`:x; };
  const lines=["hasta_kodu,hasta_turu,bolge,tarih,bilesen,kod,kategori,niteleyici"];
  pats.forEach(p=>(p.icf||[]).forEach(pr=>{ Object.entries(pr.r||{}).forEach(([c,v])=>lines.push([p.code,p.type||"POSTOP",p.group,pr.date,c[0],c,icfName(c),v].map(q).join(",")));
    (pr.extra||[]).forEach(x=>lines.push([p.code,p.type||"POSTOP",p.group,pr.date,x.c[0],x.c,x.t,x.q].map(q).join(","))); }));
  if(lines.length===1){ toast("Henüz ICF verisi yok."); return; }
  let dl=null; try{ dl=await __LOCAL.use("downloads"); }catch(e){}
  const csv="\uFEFF"+lines.join("\n");
  if(dl){ try{ await dl.save({filename:`icf-${today()}.csv`, data:csv}); toast("ICF CSV indirildi."); return; }catch(e){ if(e?.code==="declined") return; } }
  S.csvText=csv.replace(/^\uFEFF/,""); S.view="arastirma"; render();
}
async function exportCsv(studyId){
  const csv=buildCsv(studyId);
  const st=ST().find(s=>s.id===studyId);
  const name=(st?st.name:"tum-veriler").toLowerCase().replace(/[^a-z0-9ğüşıöç]+/gi,"-")+"-"+today()+".csv";
  let dl=null; try{ dl = await __LOCAL.use("downloads"); }catch(e){}
  if(dl){ try{ await dl.save({filename:name, data:csv}); toast("CSV indirildi."); return; } catch(e){ if(e&&e.code==="declined") return; } }
  S.csvText=csv.replace(/^﻿/,""); render();
}

function viewPubs(){
  const f=[["AKTIF","Sürenler"],["ALL","Tümü"]];
  const list=S.pubs.filter(x=>S.pubFilter==="ALL"||!["Yayında","Ret"].includes(x.status))
    .sort((a,b)=>PUB_STATUS.indexOf(b.status)-PUB_STATUS.indexOf(a.status)||(a.deadline||"9").localeCompare(b.deadline||"9"));
  const rows=list.map(x=>{const st=S.students.find(y=>y.id===x.student); const n=daysTo(x.deadline);
    return `<tr><td class="ttl"><button class="rowbtn" data-act="editPub" data-id="${x.id}">${esc(x.title)}</button><div class="hint">${esc(x.type)}${x.venue?" · "+esc(x.venue):""}${st?" · "+esc(st.name):""}</div></td>
      <td><span class="pill ${pubCls(x.status)}">${esc(x.status)}</span></td>
      <td>${x.deadline?`${fmtDate(x.deadline)}<div class="hint">${esc(x.deadlineNote||"")} <span class="delta ${n<0?"bad":n<=14?"warnc":"flat"}">${dueTxt(n)}</span></div>`:"—"}</td></tr>`;}).join("");
  return `<div class="detail"><div class="dhead"><div><h2 style="font-family:var(--f-display);font-weight:400;font-size:30px">Yayınlar ve bildiriler</h2>
      <div class="facts"><span>Makale, kongre bildirisi ve proje başvurularının aşaması ve son tarihleri.</span></div></div>
      <div class="actions"><button class="btn primary" data-act="newPub">+ Yayın</button></div></div>
    <div class="filters">${f.map(([k,l])=>`<button class="chip" data-act="pubFilter" data-v="${k}" aria-pressed="${S.pubFilter===k}">${l}</button>`).join("")}</div>
    ${list.length?`<div class="panel"><div class="tbl-wrap"><table class="pubs"><thead><tr><th>Başlık</th><th>Durum</th><th>Son tarih</th></tr></thead><tbody>${rows}</tbody></table></div></div>`
      :`<div class="empty">${S.pubs.length?"Süren yayın yok; tümünü görmek için “Tümü”ne basın.":"Henüz yayın eklenmedi. Yazımdaki bir makaleyi ya da kongre özetini ekleyerek başlayın."}<br><br><button class="btn primary" data-act="newPub">+ Yayın</button></div>`}</div>`;
}
function viewKutuphane(){
  const tabs=`<div class="filters" style="margin-bottom:16px"><button class="chip" data-act="libTab" data-v="egzersiz" aria-pressed="${S.libTab==="egzersiz"}">Egzersizler</button><button class="chip" data-act="libTab" data-v="olcek" aria-pressed="${S.libTab==="olcek"}">Ölçek rehberi</button></div>`;
  return tabs + (S.libTab==="olcek" ? viewGuide() : viewLibrary());
}

// ---------- guide
function viewGuide(){
  return `<div class="dhead" style="margin-bottom:16px"><h2 style="font-family:var(--f-display);font-weight:400;font-size:30px;margin:0">Ölçek rehberi</h2><button class="btn" data-act="view" data-v="ajanda">← Ajanda</button></div><div class="cards">
  <div class="panel ref"><h3>Boyun Özürlülük İndeksi (NDI)</h3><p>10 madde × 0–5 puan; ham puan ÷ 50 × 100 = %.</p><dl>
    <dt>0–8 %</dt><dd>Özürlülük yok</dd><dt>10–28 %</dt><dd>Hafif</dd><dt>30–48 %</dt><dd>Orta</dd><dt>50–68 %</dt><dd>Şiddetli</dd><dt>70+ %</dt><dd>Tam</dd>
    <dt>MKÖF</dt><dd>Servikal radikülopatide yaklaşık 7,5 ham puan (%15) önerilmiştir.</dd></dl></div>
  <div class="panel ref"><h3>Kraniyoservikal fleksiyon testi (KSFT)</h3><p>Basınç biyofeedback ünitesi 20 mmHg'de, 2 mmHg'lik 5 basamak.</p><dl>
    <dt>Aktivasyon</dt><dd>Yüzeyel fleksörler devreye girmeden 10 sn tutulabilen en yüksek basamak: 22–30 mmHg (20 = başarısız)</dd>
    <dt>Performans indeksi</dt><dd>Aktivasyon artışı × 10 sn tekrar sayısı (en fazla 10); 0–100</dd></dl></div>
  <div class="panel ref"><h3>Servikal eklem hareket açıklığı</h3><p>CROM veya inklinometre ile, derece.</p><dl>
    <dt>Fleksiyon</dt><dd>Normalde yaklaşık 50–60°</dd><dt>Ekstansiyon</dt><dd>Yaklaşık 60–75°</dd><dt>Rotasyon</dt><dd>Her yöne yaklaşık 70–80°; defter sağ + sol toplamını izler</dd></dl></div>
  <div class="panel ref"><h3>ICF niteleyicileri</h3><p>Defterdeki kategoriler bel ve boyun ağrısı çekirdek setlerinden seçilmiştir; listede olmayan kodu değerlendirmede elle ekleyebilirsiniz.</p><dl>
    <dt>0</dt><dd>Sorun yok (%0–4)</dd><dt>1</dt><dd>Hafif (%5–24)</dd><dt>2</dt><dd>Orta (%25–49)</dd><dt>3</dt><dd>Ağır (%50–95)</dd><dt>4</dt><dd>Tam (%96–100)</dd>
    <dt>e: +1…+4</dt><dd>Kolaylaştırıcı; düz 1…4 engel</dd><dt>8 / 9</dt><dd>Belirtilmemiş / uygulanamaz</dd></dl></div>
  <div class="panel ref"><h3>Multifidus ultrason</h3><p>Defter asimetriyi ve kontraksiyon oranını kendisi hesaplar.</p><dl>
    <dt>Bel</dt><dd>CSA (cm²), L4–L5 ve L5–S1, sağ ve sol</dd><dt>Boyun</dt><dd>CSA (cm²), C4–C5 ve C5–C6, sağ ve sol</dd><dt>Asimetri</dt><dd>|sağ − sol| ÷ büyük taraf × 100</dd>
    <dt>Kontr. oranı</dt><dd>Kontraksiyondaki kalınlık ÷ dinlenmedeki kalınlık. 1'in üzeri aktivasyon gösterir.</dd></dl></div>
  <div class="panel ref"><h3>Yağlı dejenerasyon ve ODI</h3><dl>
    <dt>Goutallier</dt><dd>0 yağ yok · 1 birkaç yağ çizgisi · 2 yağ &lt; kas · 3 yağ = kas · 4 yağ &gt; kas</dd>
    <dt>ODI</dt><dd>10 madde × 0–5 puan. Ham puan ÷ 50 × 100 = %. Önerilen MKÖF yaklaşık 10 puan.</dd>
    <dt>NRS</dt><dd>0–10 ağrı; önerilen MKÖF yaklaşık 2 puan.</dd></dl></div>
  </div><p class="hint" style="margin-top:14px">MKÖF eşikleri literatürdeki yaygın önerilerdir; çalışmanızın popülasyonuna uygun değeri kendiniz doğrulayın.</p>`;
}

// ---------- sheet (forms)
function fld(name,label,val,type="number",extra=""){ return `<div class="f"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(val??"")}" ${type==="number"?'step="any" inputmode="decimal"':""} ${extra}></div>`; }
function sel(name,label,opts,val){ return `<div class="f"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(val??"")===String(v)?"selected":""}>${esc(l)}</option>`;}).join("")}</select></div>`; }

      <p class="hint">Tüm kayıtlar yalnızca bu bilgisayardaki tarayıcıda saklanır; internete gönderilmez. Tarayıcı verileri temizlenirse kaybolabilir; düzenli yedek alın ve yedek dosyasını güvenli bir yerde saklayın.</p>
      ${autoPanel()}
      <div class="panel"><div class="panel-h"><h3>Elle yedek indir</h3></div><p class="hint" style="margin-top:0">${S.patients.length} hasta, ${S.students.length} öğrenci, ${(S.customEx||[]).length} kendi egzersiziniz. Son yedek: ${lb?fmtDate(lb.slice(0,10)):"hiç alınmadı"}.</p>
        <button class="btn primary" data-act="doBackup">Yedeği indir</button></div>
      <div class="panel"><div class="panel-h"><h3>Yedekten geri yükle</h3></div><p class="hint" style="margin-top:0">Başka bir bilgisayara taşırken ya da veriler silindiyse kullanın. Bu bilgisayardaki mevcut kayıtların yerini alır.</p>
        <input id="f-restore" type="file" accept=".json,application/json">
        ${S.restoreData?`<div class="confirm" style="margin-top:10px">Yedekte ${S.restoreData.np} hasta ve ${S.restoreData.ns} öğrenci var. Mevcut kayıtlar silinip bunlar yüklenecek. <button type="button" class="btn danger" data-act="doRestore">Evet, yükle</button><button type="button" class="btn ghost" data-act="noRestore">Vazgeç</button></div>`:""}</div>
      <div class="sheet-foot"><span></span><button type="button" class="btn" data-act="close">Kapat</button></div></div></div>`; return;
  } else if(sh.type==="copy"){
    root.innerHTML = `<div class="sheet-bg" data-act="closeBg"><div class="sheet" role="dialog" aria-modal="true"><h3>Metni kopyalayın</h3>
      <p class="hint">Bu görünümde otomatik kopyalama çalışmadı. Metin seçili; Ctrl+C (veya uzun basıp Kopyala) ile alın.</p>
      <textarea class="csv" id="copyText" readonly style="height:320px">${esc(sh.text)}</textarea>
      <div class="sheet-foot"><span></span><button type="button" class="btn primary" data-act="close">Kapat</button></div></div></div>`;
    const ta=$("#copyText"); ta.focus(); ta.select(); return;
  } else if(sh.type==="student"){
    const s = sh.sid ? S.students.find(x=>x.id===sh.sid) : {level:"Stajyer", stage:"Ders dönemi"};
    html = `<h3>${sh.sid?"Öğrenciyi düzenle":"Yeni öğrenci"}</h3>
      <fieldset><legend>Öğrenci</legend><div class="f wide"><label for="f-name">Ad soyad</label><input id="f-name" name="name" required value="${esc(s.name||"")}"></div>
        ${sel("level","Düzey",["Stajyer","YL","Doktora"],s.level)}${fld("start","Başlangıç",s.start,"date")}${sel("stage","Aşama",STAGES,s.stage)}</fieldset>
      <fieldset><legend>Tez</legend><div class="f wide"><label for="f-topic">Tez konusu veya staj dönemi</label><textarea id="f-topic" name="topic" rows="2">${esc(s.topic||"")}</textarea></div>
</fieldset>
      <fieldset><legend>Takvim</legend>${fld("nextMeet","Sonraki görüşme",s.nextMeet,"date")}${fld("deadline","Son tarih",s.deadline,"date")}
        <div class="f"><label for="f-deadlineNote">Son tarih ne için</label><input id="f-deadlineNote" name="deadlineNote" value="${esc(s.deadlineNote||"")}" placeholder="TİK raporu"></div></fieldset>`;
  }
  const canDel = (sh.type==="patient"&&sh.pid)||(sh.type==="assess"&&sh.aid)||(sh.type==="study"&&sh.sid)||(sh.type==="student"&&sh.sid)||(sh.type==="exercise"&&sh.xid)||(sh.type==="pub"&&sh.xid)||(sh.type==="exVideo"&&S.exMedia[sh.xid])||(sh.type==="customEx"&&sh.xid)||(sh.type==="icf"&&sh.aid);
  const delLabel = sh.type==="patient"?"Hastayı ve tüm değerlendirmelerini sil":sh.type==="assess"?"Bu değerlendirmeyi sil":sh.type==="student"?"Öğrenciyi ve notlarını sil":sh.type==="exercise"?"Programdan çıkar":sh.type==="pub"?"Yayını sil":sh.type==="exVideo"?"Videoyu kaldır":sh.type==="customEx"?"Egzersizi kütüphaneden sil":sh.type==="icf"?"Bu ICF değerlendirmesini sil":"Çalışmayı sil (hastalar kalır)";
  root.innerHTML = `<div class="sheet-bg" data-act="closeBg"><form class="sheet" id="sheetForm" role="dialog" aria-modal="true">${html}
    <div class="sheet-foot">${canDel ? (S.confirm ? `<span class="confirm">Emin misiniz? <button type="button" class="btn danger" data-act="doDelete">Evet, sil</button><button type="button" class="btn ghost" data-act="noDelete">Vazgeç</button></span>` : `<button type="button" class="btn danger ghost" data-act="askDelete">${delLabel}</button>`) : "<span></span>"}
      <span class="actions"><button type="button" class="btn" data-act="close">İptal</button><button type="submit" class="btn primary" ${S.busy?"disabled":""}>${S.busy?"Yükleniyor…":"Kaydet"}</button></span></div></form></div>`;
  updateCalc();
  const first=root.querySelector("input,select"); if(first && !S.confirm) first.focus({preventScroll:true});
}
function updateCalc(){
  const f=$("#sheetForm"); if(!f) return; const v=n=>num(f.elements[n]?.value);
  const set=(k,t)=>{ const el=f.querySelector(`[data-calc="${k}"]`); if(el) el.textContent=t; };
  if(f.elements.odi_raw){ const o=v("odi_raw"); set("odi", o==null?"—":fmt(o/50*100)+" %"+(o>50?" (50'yi aşamaz)":"")); }
  if(f.elements.l4r){ const s=asym(v("l4r"),v("l4l")); set("asym", s==null?"—":fmt(s)+" %"+(v("l4r")!=null&&v("l4l")!=null?(v("l4r")<v("l4l")?" · sağ küçük":v("l4r")>v("l4l")?" · sol küçük":""):"")); }
  if(f.elements.rest_mm){ const r=v("rest_mm"),c=v("contr_mm"); set("ratio", r&&c!=null?fmt(c/r,2)+" ×":"—"); }
  if(f.elements.ndi_raw){ const o=v("ndi_raw"); set("ndi", o==null?"—":fmt(o/50*100)+" %"+(o>50?" (50'yi aşamaz)":"")); }
  if(f.elements.c5r){ const s=asym(v("c5r"),v("c5l")); set("casym", s==null?"—":fmt(s)+" %"+(v("c5r")!=null&&v("c5l")!=null?(v("c5r")<v("c5l")?" · sağ küçük":v("c5r")>v("c5l")?" · sol küçük":""):"")); }
}
async function saveVideo(f){
  const id=S.sheet.xid; const file=f.elements.vfile?.files?.[0]; const link=f.elements.vlink.value.trim();
  const old=S.exMedia[id]||{};
  if(file){
    if(file.size>20*1024*1024){ toast("Dosya 20 MB'tan büyük; daha kısa bir klip ya da link deneyin."); return; }
    const type = /\.webm$/i.test(file.name)?"video/webm":"video/mp4";
    S.busy=true; renderSheet();
    try{ const r=await S.assets.upload(file,{type}); S.exMedia={...S.exMedia,[id]:{assetId:r.id}};
      if(old.assetId) S.assets.delete(old.assetId).catch(()=>{});
      saveMeta(); toast("Video yüklendi.");
    }catch(e){ S.busy=false; renderSheet(); toast(e?.code==="too_large"?"Dosya çok büyük (en fazla 20 MB).":e?.code==="unsupported_type"?"Bu dosya türü desteklenmiyor; MP4 deneyin.":e?.code==="quota_or_state"?"Video alanı dolu; eski videoları kaldırın.":"Yüklenemedi, tekrar deneyin."); return; }
    S.busy=false;
  } else if(link){
    if(!safeLink(link)){ toast("Link https:// ile başlamalı."); return; }
    S.exMedia={...S.exMedia,[id]:{link}}; if(old.assetId) S.assets?.delete(old.assetId).catch(()=>{});
    saveMeta(); toast("Video linki kaydedildi.");
  } else { toast("Bir dosya seçin ya da link girin."); return; }
  S.sheet=null; S.confirm=null; render();
}
function submitSheet(f){
  const sh=S.sheet; if(sh.type==="exVideo"){ if(!S.busy) saveVideo(f); return; }
  const d=Object.fromEntries(new FormData(f).entries());
  if(sh.type==="patient"){
    const code=d.code.trim(); if(!code){ toast("Hasta kodu gerekli."); return; }
    if(S.patients.some(p=>p.code.toLowerCase()===code.toLowerCase() && p.id!==sh.pid)){ toast("Bu kod zaten kullanılıyor."); return; }
    const base = sh.pid ? S.patients.find(p=>p.id===sh.pid) : {id:rid("p-"), kind:"patient", assessments:[]};
    const p = {...base, code, group:d.group, sex:d.sex, age:num(d.age), dx:d.dx.trim(), surgery:d.surgery.trim(), surgeryDate:d.surgeryDate, type:d.type, owner:d.type==="OZEL"?"":d.owner, pkg:num(d.pkg)};
    upsertPatient(p); S.sel=p.id; S.view="hastalar"; toast("Hasta kaydedildi.");
  } else if(sh.type==="assess"){
    const p=JSON.parse(JSON.stringify(S.patients.find(x=>x.id===sh.pid)));
    const numKeys=["nrs","odi_raw","ndi_raw","l4r","l4l","l5r","l5l","c4r","c4l","c5r","c5l","rest_mm","contr_mm","ccft","ccft_pi","flex","ext","rotR","rotL"];
    const lim={nrs:10,odi_raw:50,ndi_raw:50,ccft_pi:100};
    for(const k of Object.keys(lim)){ if(d[k]!==undefined && num(d[k])!=null && (num(d[k])<0||num(d[k])>lim[k])){ toast(`${k.toUpperCase()} 0–${lim[k]} aralığında olmalı.`); return; } }
    const a={id: sh.aid || rid("a-")};
    for(const [k,v] of Object.entries(d)){ a[k] = numKeys.includes(k) ? num(v) : (typeof v==="string"?v.trim():v); }
    if(a.goutallier!==undefined) a.goutallier = a.goutallier===""?null:+a.goutallier;
    const i=p.assessments.findIndex(x=>x.id===a.id); if(i<0) p.assessments.push(a); else p.assessments[i]=a;
    upsertPatient(p); toast("Değerlendirme kaydedildi.");
  } else if(sh.type==="study"){
    const name=d.name.trim(); if(!name){ toast("Çalışma adı gerekli."); return; }
    const arms=d.arms.split(",").map(s=>s.trim()).filter(Boolean);
    const s={id: sh.sid||rid("st-"), name, arms: arms.length?arms:["Tek kol"], metric:d.metric};
    const i=S.studies.findIndex(x=>x.id===s.id); if(i<0) S.studies.push(s); else S.studies[i]=s;
    saveMeta(); S.studySel=s.id; toast("Çalışma kaydedildi.");
  } else if(sh.type==="exercise"){
    const p=JSON.parse(JSON.stringify(S.patients.find(x=>x.id===sh.pid)));
    const ex=allEx().find(x=>x.id===d.exId);
    const name=(d.name.trim()||ex?.name||""); if(!name){ toast("Egzersiz seçin veya ad yazın."); return; }
    p.program=p.program||{items:[],adherence:[]}; p.program.items=p.program.items||[];
    const it={id:sh.xid||rid("x-"), exId:d.exId, name, dose:d.dose.trim()||ex?.dose||"", freq:d.freq, start:d.start, end:d.end, note:d.note.trim()};
    const i=p.program.items.findIndex(x=>x.id===it.id); if(i<0) p.program.items.push(it); else p.program.items[i]=it;
    upsertPatient(p); toast("Program güncellendi.");
  } else if(sh.type==="icf"){
    const p=JSON.parse(JSON.stringify(S.patients.find(x=>x.id===sh.pid)));
    const r={}; Object.entries(d).forEach(([k,v])=>{ if(k.startsWith("icf_") && v!=="") r[k.slice(4)]=v; });
    const extra=[]; for(let i=0;i<10;i++){ const c=(d["xc"+i]||"").trim().toLowerCase(); if(c) extra.push({c, t:(d["xt"+i]||"").trim(), q:(d["xq"+i]||"").trim()}); }
    if(!Object.keys(r).length && !extra.length){ toast("En az bir kategori için niteleyici seçin."); return; }
    const rec={id:sh.aid||rid("icf-"), date:d.date||today(), r, extra, pf:d.pf.trim(), goal:d.goal.trim()};
    p.icf=p.icf||[]; const i=p.icf.findIndex(x=>x.id===rec.id); if(i<0) p.icf.push(rec); else p.icf[i]=rec;
    upsertPatient(p); toast("ICF profili kaydedildi.");
  } else if(sh.type==="pub"){
    const title=d.title.trim(); if(!title){ toast("Başlık gerekli."); return; }
    const base = sh.xid ? S.pubs.find(y=>y.id===sh.xid) : {id:rid("pb-"), kind:"pub"};
    upsertPub({...base, title, type:d.type, status:d.status, venue:d.venue.trim(), student:d.student, study:d.study, deadline:d.deadline, deadlineNote:d.deadlineNote.trim(), note:d.note.trim()});
    toast("Yayın kaydedildi.");
  } else if(sh.type==="customEx"){
    const name=d.name.trim(); if(!name){ toast("Ad gerekli."); return; }
    const ex={id:sh.xid||rid("xc-"), g:d.g, k:d.k, name, dose:d.dose.trim(), cue:d.cue.trim(), custom:true};
    const list=[...(S.customEx||[])]; const i=list.findIndex(x=>x.id===ex.id); if(i<0) list.push(ex); else list[i]=ex; S.customEx=list;
    if(sh.copyFrom && S.exMedia[sh.copyFrom] && !S.exMedia[ex.id]) S.exMedia={...S.exMedia,[ex.id]:{...S.exMedia[sh.copyFrom]}};
    saveMeta(); toast(sh.xid?"Egzersiz güncellendi.":"Kütüphaneye eklendi.");
  } else if(sh.type==="student"){
    const name=d.name.trim(); if(!name){ toast("Ad gerekli."); return; }
    const base = sh.sid ? S.students.find(x=>x.id===sh.sid) : {id:rid("s-"), kind:"student", log:[]};
    const s={...base, name, level:d.level, start:d.start, stage:d.stage, topic:d.topic.trim(), nextMeet:d.nextMeet, deadline:d.deadline, deadlineNote:d.deadlineNote.trim()};
    upsertStudent(s); S.stuSel=s.id; toast("Öğrenci kaydedildi.");
  }
  S.sheet=null; S.confirm=null; render();
}
function doDelete(){
  const sh=S.sheet;
  if(sh.type==="patient"){ S.patients=S.patients.filter(p=>p.id!==sh.pid); save(sh.pid,null); S.sel=null; toast("Hasta silindi."); }
  else if(sh.type==="assess"){ const p=JSON.parse(JSON.stringify(S.patients.find(x=>x.id===sh.pid))); p.assessments=p.assessments.filter(a=>a.id!==sh.aid); upsertPatient(p); toast("Değerlendirme silindi."); }
  else if(sh.type==="study"){ S.studies=S.studies.filter(s=>s.id!==sh.sid); saveMeta();
    S.patients.filter(p=>p.study===sh.sid).forEach(p=>upsertPatient({...p,study:"",arm:""})); toast("Çalışma silindi."); }
  else if(sh.type==="exercise"){ const p=JSON.parse(JSON.stringify(S.patients.find(x=>x.id===sh.pid))); p.program.items=p.program.items.filter(x=>x.id!==sh.xid); upsertPatient(p); toast("Programdan çıkarıldı."); }
  else if(sh.type==="icf"){ const p=JSON.parse(JSON.stringify(S.patients.find(x=>x.id===sh.pid))); p.icf=(p.icf||[]).filter(x=>x.id!==sh.aid); upsertPatient(p); toast("ICF değerlendirmesi silindi."); }
  else if(sh.type==="customEx"){ S.customEx=(S.customEx||[]).filter(x=>x.id!==sh.xid); saveMeta(); toast("Egzersiz silindi; programlardaki kayıtlar adıyla kalır."); }
  else if(sh.type==="exVideo"){ const m=S.exMedia[sh.xid]; if(m?.assetId) S.assets?.delete(m.assetId).catch(()=>{}); const c={...S.exMedia}; delete c[sh.xid]; S.exMedia=c; saveMeta(); toast("Video kaldırıldı."); }
  else if(sh.type==="pub"){ S.pubs=S.pubs.filter(y=>y.id!==sh.xid); save(sh.xid,null); toast("Yayın silindi."); }
  else if(sh.type==="student"){ S.students=S.students.filter(s=>s.id!==sh.sid); save(sh.sid,null); S.stuSel=null; toast("Öğrenci silindi."); }
  S.sheet=null; S.confirm=null; render();
}

// ---------- events
document.addEventListener("click", e => {
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if(a==="closeBg" && e.target!==t) return;
  switch(a){
    case "view": if(t.dataset.v==="__backup"){ S.sheet={type:"backup"}; S.confirm=null; render(); break; } S.view=t.dataset.v; S.csvText=null; render(); break;
    case "filter": S.filter=t.dataset.v; S.sel=null; render(); break;
    case "sel": S.sel=t.dataset.id; render(); if(innerWidth<820) $(".detail")?.scrollIntoView({behavior:"smooth",block:"start"}); break;
    case "metric": S.metric[t.dataset.id]=t.dataset.v; render(); break;
    case "newPatient": S.sheet={type:"patient"}; S.confirm=null; render(); break;
    case "editPatient": S.sheet={type:"patient",pid:t.dataset.id}; S.confirm=null; render(); break;
    case "newA": S.sheet={type:"assess",pid:t.dataset.id}; S.confirm=null; render(); break;
    case "editA": S.sheet={type:"assess",pid:t.dataset.id,aid:t.dataset.a}; S.confirm=null; render(); break;
    case "newStudy": S.sheet={type:"study"}; S.confirm=null; render(); break;
    case "editStudy": S.sheet={type:"study",sid:t.dataset.v}; S.confirm=null; render(); break;
    case "exVideo": S.sheet={type:"exVideo",xid:t.dataset.x}; S.confirm=null; render(); break;
    case "play": S.sheet={type:"play",xid:t.dataset.x}; render(); break;
    case "newPub": S.sheet={type:"pub"}; S.confirm=null; render(); break;
    case "editPub": S.sheet={type:"pub",xid:t.dataset.id}; S.confirm=null; render(); break;
    case "pubFilter": S.pubFilter=t.dataset.v; render(); break;
    case "libTab": S.libTab=t.dataset.v; render(); break;
    case "tfilter": S.tfilter=t.dataset.v; S.sel=null; render(); break;
    case "goStu": S.view="ogrenciler"; render(); break;
    case "newEx": S.sheet={type:"exercise",pid:t.dataset.id}; S.confirm=null; render(); break;
    case "editEx": S.sheet={type:"exercise",pid:t.dataset.id,xid:t.dataset.x}; S.confirm=null; render(); break;
    case "copyProg": copyText(progText(S.patients.find(x=>x.id===t.dataset.id))); break;
    case "newCustomEx": S.sheet={type:"customEx"}; S.confirm=null; render(); break;
    case "loadDemo": loadDemo(); break;
    case "doBackup": doBackup(); break;
    case "chooseAuto": window.__LOCAL.chooseAuto().then(st=>{ toast(st==="ok"?"Otomatik yedek açıldı.":"Dosyaya yazılamadı; tekrar deneyin."); }).catch(e=>{ if(e?.name!=="AbortError") toast("Dosya seçilemedi."); }); break;
    case "resumeAuto": window.__LOCAL.resumeAuto().then(st=>toast(st==="ok"?"Otomatik yedek sürüyor.":"İzin verilmedi; yedek duraklatıldı.")); break;
    case "stopAuto": window.__LOCAL.stopAuto().then(()=>toast("Otomatik yedek kapatıldı. Dosya yerinde duruyor.")); break;
    case "doRestore": { const docs=S.restoreData.docs; S.restoreData=null; S.sheet=null; S.sel=null; S.stuSel=null; window.__LOCAL.load(docs); render(); toast("Yedek yüklendi."); break; }
    case "noRestore": S.restoreData=null; renderSheet(); break;
    case "allSess": S.allSess = S.allSess===t.dataset.id ? null : t.dataset.id; render(); break;
    case "clearDemo": clearDemo(); break;
    case "newIcf": S.sheet={type:"icf",pid:t.dataset.id}; S.confirm=null; render(); break;
    case "editIcf": S.sheet={type:"icf",pid:t.dataset.id,aid:t.dataset.a}; S.confirm=null; render(); break;
    case "csvIcf": exportIcf(t.dataset.v); break;
    case "editCustomEx": S.sheet={type:"customEx",xid:t.dataset.x}; S.confirm=null; render(); break;
    case "copyEx": S.sheet={type:"customEx",copyFrom:t.dataset.x}; S.confirm=null; render(); break;
    case "hideEx": { const h=S.hiddenEx||[]; S.hiddenEx = h.includes(t.dataset.x) ? h.filter(x=>x!==t.dataset.x) : [...h,t.dataset.x]; saveMeta(); render(); break; }
    case "toggleHidden": S.showHidden=!S.showHidden; render(); break;
    case "printProg": printProgram(t.dataset.id); break;
    case "exFilter": S.exFilter=t.dataset.v; render(); break;
    case "pSel": S.sel=t.dataset.id; S.view="hastalar"; render(); break;
    case "stuSel": S.stuSel=t.dataset.id; if(S.view!=="ogrenciler") S.view="ogrenciler"; render(); break;
    case "newStu": S.sheet={type:"student"}; S.confirm=null; render(); break;
    case "editStu": S.sheet={type:"student",sid:t.dataset.id}; S.confirm=null; render(); break;
    case "study": S.studySel=t.dataset.v; S.resMetric=null; render(); break;
    case "resMetric": S.resMetric=t.dataset.v; render(); break;
    case "csv": exportCsv(t.dataset.v); break;
    case "copyCsv": { const ta=$("#csvText"); navigator.clipboard?.writeText(S.csvText).then(()=>toast("Kopyalandı."),()=>{ta.focus();ta.select();toast("Metni seçtim; Ctrl+C ile kopyalayın.");}); if(!navigator.clipboard){ta.focus();ta.select();} break; }
    case "closeCsv": S.csvText=null; render(); break;
    case "close": case "closeBg": S.sheet=null; S.confirm=null; render(); break;
    case "askDelete": S.confirm=true; renderSheet(); break;
    case "noDelete": S.confirm=null; renderSheet(); break;
    case "doDelete": doDelete(); break;
  }
});
document.addEventListener("submit", e => { if(e.target.id==="sheetForm"){ e.preventDefault(); submitSheet(e.target); } else if(e.target.id==="logForm"){ e.preventDefault(); addLog(e.target); }
  else if(e.target.id==="adhForm"){ e.preventDefault(); addAdh(e.target); }
  else if(e.target.id==="sessForm"){ e.preventDefault(); addSess(e.target); }
  else if(e.target.id==="apptForm"){ e.preventDefault(); setAppt(e.target); } });
document.addEventListener("input", e => { if(e.target.closest("#sheetForm")) updateCalc(); });
let qT; document.addEventListener("input", e => { if(e.target.id==="f-exq"){ clearTimeout(qT); qT=setTimeout(()=>{ S.exQ=e.target.value; render(); const el=$("#f-exq"); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } },200); } });
document.addEventListener("change", e => { if(e.target.id==="f-restore"){ readRestore(e.target.files?.[0]); return; }
  if(e.target.id==="f-excat"){ S.exCat=e.target.value; render(); return; } if(e.target.id==="f-exId"){ const ex=allEx().find(x=>x.id===e.target.value); const f=e.target.form; if(ex){ f.elements.name.value=ex.name; f.elements.dose.value=ex.dose||""; } } });
document.addEventListener("keydown", e => { if(e.key==="Escape" && S.sheet){ S.sheet=null; S.confirm=null; render(); } });

init();
})();
</script>

</body></html>
